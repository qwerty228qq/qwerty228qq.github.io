<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Визитка</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;

            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);

        }
        .name {
            font-size: 2em;
            margin-bottom: 10px;
        }
        .contact a {
            display: block;
            margin: 5px 0;
            color: #3498db;
            text-decoration: none;
        }
        .contact a:hover {
            text-decoration: underline;
        }
        .download {
            margin-top: 15px;
            display: inline-block;
            padding: 10px 20px;
            background-color: #3498db;
            color: #fff;
            border-radius: 5px;
            text-decoration: none;
        }
        .download:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="name">Ваше Имя</div>
        <div class="contact">
            <a href="mailto:example@example.com">example@example.com</a>

        </div>
        <a href="path/to/yourfile.mp3" class="download" download>Скачать аудиофайл</a>
    </div>

    <audio autoplay>
        <source src="https://track.pinkamuz.pro/download/b33434b334323631883731353332313036340500/c4face3435b2029cfd7bdea0f8997ad5/Counter-Strike%201.6%20-%20Main%20Theme%20%28OST%29.mp3" type="audio/mpeg">

</html>
