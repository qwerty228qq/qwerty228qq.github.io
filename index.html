<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Моя Визитка</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Добро пожаловать!</h1>
        <p>Меня зовут Виктор Меркулов, я веб-разработчик.</p>
        <button id="play-button">Воспроизвести аудио</button>
    </div>

   <a href="https://track.pinkamuz.pro/download/b33434b334323631883731353332313036340500/c4face3435b2029cfd7bdea0f8997ad5/Counter-Strike%201.6%20-%20Main%20Theme%20%28OST%29.mp3">Скачать аудиофайл</a>

    <script>
        const playButton = document.getElementById('play-button');
        const audio = document.getElementById('background-audio');

        playButton.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playButton.textContent = 'Пауза';
            } else {
                audio.pause();
                playButton.textContent = 'Воспроизвести аудио';
            }
        });
    </script>
</body>
</html>
